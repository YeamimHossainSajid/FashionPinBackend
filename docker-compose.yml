      context: .
      dockerfile: media-service/Dockerfile
    container_name: fashionpin-media-service
    ports:
      - "8101:8101"
      - "9101:9101"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_ENABLED: "true"
      DB_URL: jdbc:postgresql://postgres:5432/media_db
      DB_USERNAME: fashionpin
      DB_PASSWORD: fashionpin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      GRPC_PORT: "9101"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-fashionpin-media}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_in_production}
    depends_on:
      - discovery-service
      - config-server
      - postgres
      - redis
      - minio
    networks:
      - fashionpin-net


volumes:
  postgres_data:
  grafana_data:
  minio_data:

networks:
  fashionpin-net:
    driver: bridge
