services:
  postgres:
    image: postgres:16-alpine
    container_name: fashionpin-postgres
    environment:
      POSTGRES_USER: fashionpin
      POSTGRES_PASSWORD: fashionpin
      POSTGRES_DB: fashionpin
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=256MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - fashionpin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashionpin"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fashionpin-redis
    ports:
      - "6379:6379"
    networks:
      - fashionpin-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: fashionpin-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fashionpin-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fashionpin-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - fashionpin-net

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: fashionpin-zipkin
    ports:
      - "9411:9411"
    networks:
      - fashionpin-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fashionpin-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - fashionpin-net

  grafana:
    image: grafana/grafana:11.1.4
    container_name: fashionpin-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fashionpin-net


  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: fashionpin-discovery
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - fashionpin-net

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: fashionpin-config
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      CONFIG_SERVER_USERNAME: config
      CONFIG_SERVER_PASSWORD: config
    depends_on:
      - discovery-service
    networks:
      - fashionpin-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: fashionpin-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      - discovery-service
      - config-server
      - redis
    networks:
      - fashionpin-net

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: fashionpin-auth-service
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_ENABLED: "true"
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: fashionpin
      DB_PASSWORD: fashionpin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      GRPC_PORT: "9081"
