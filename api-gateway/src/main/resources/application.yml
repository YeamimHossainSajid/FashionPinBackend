spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:

      - id: auth-service
        uri: lb://auth-service
        predicates:
          - Path=/api/auth/**, /api/v1/auth/**

      - id: user-service
        uri: lb://user-service
        predicates:
          - Path=/api/users/**, /api/v1/user/**

      - id: profile-service
        uri: lb://profile-service
        predicates:
          - Path=/api/profiles/**, /api/v1/profile/**

      - id: fashion-discovery-service
        uri: lb://fashion-discovery-service
        predicates:
          - Path=/api/fashion/**, /api/v1/fashion-discovery/**

      - id: product-service
        uri: lb://product-service
        predicates:
          - Path=/api/products/**, /api/v1/product/**, /api/categories/**, /api/v1/categories/**, /api/collections/**, /api/v1/collections/**, /api/storefront/**, /api/v1/storefront/**, /api/admin/**

      - id: search-service
        uri: lb://search-service
        predicates:
          - Path=/api/search/**, /api/v1/search/**
        filters:
          - RewritePath=/api/v1/search(?<segment>/?.*), /api/v1${segment}
          # Rate limiting placeholder: enable RequestRateLimiter when Redis is available.

      - id: recommendation-service
        uri: lb://recommendation-service
        predicates:
          - Path=/api/v1/recommendation/**
        filters:
          - RewritePath=/api/v1/recommendation(?<segment>/?.*), /api/v1${segment}
          # Rate limiting placeholder: enable RequestRateLimiter when Redis is available.

      - id: outfit-detection-service
        uri: lb://outfit-detection-service
        predicates:
          - Path=/api/outfit-detection/**, /api/v1/outfit-detection/**

      - id: image-processing-service
        uri: lb://image-processing-service
        predicates:
          - Path=/api/v1/image-processing/**
        filters:
          - RewritePath=/api/v1/image-processing(?<segment>/?.*), /api/v1${segment}
          # Rate limiting placeholder: enable RequestRateLimiter when Redis is available.

      - id: visual-search-service
        uri: lb://visual-search-service
        predicates:
          - Path=/api/visual-search/**, /api/v1/visual-search/**
        filters:
          - RewritePath=/api/v1/visual-search(?<segment>/?.*), /api/v1${segment}
          # Rate limiting placeholder: enable RequestRateLimiter when Redis is available.

      - id: ai-stylist-service
        uri: lb://ai-stylist-service
        predicates:
          - Path=/api/v1/ai-stylist/**
        filters:
          - RewritePath=/api/v1/ai-stylist(?<segment>/?.*), /api/v1${segment}
          # Rate limiting placeholder: enable RequestRateLimiter when Redis is available.

      - id: virtual-tryon-service
        uri: lb://virtual-tryon-service
        predicates:
          - Path=/api/v1/virtual-tryon/**
        filters:
          - RewritePath=/api/v1/virtual-tryon(?<segment>/?.*), /api/v1${segment}
          # Rate limiting placeholder: enable RequestRateLimiter when Redis is available.

      - id: moodboard-service
        uri: lb://moodboard-service
        predicates:
          - Path=/api/v1/moodboard/**
        filters:
          - RewritePath=/api/v1/moodboard(?<segment>/?.*), /api/v1${segment}
          # Rate limiting placeholder: enable RequestRateLimiter when Redis is available.

      - id: shopping-service
        uri: lb://shopping-service
        predicates:
          - Path=/api/cart/**, /api/v1/shopping/**, /api/v1/cart/**

      - id: order-service
        uri: lb://order-service
        predicates:
          - Path=/api/orders/**, /api/v1/order/**, /api/v1/orders/**

      - id: payment-service
        uri: lb://payment-service
        predicates:
          - Path=/api/payment/**, /api/v1/payment/**

      - id: inventory-service
        uri: lb://inventory-service
        predicates:
          - Path=/api/v1/inventory/**
        filters:
          - RewritePath=/api/v1/inventory(?<segment>/?.*), /api/v1${segment}
          # Rate limiting placeholder: enable RequestRateLimiter when Redis is available.

      - id: brand-integration-service
        uri: lb://brand-integration-service
        predicates:
          - Path=/api/brands/**, /api/v1/brand-integration/**

      - id: notification-service
        uri: lb://notification-service
        predicates:
          - Path=/api/v1/notification/**
        filters:
          - RewritePath=/api/v1/notification(?<segment>/?.*), /api/v1${segment}
          # Rate limiting placeholder: enable RequestRateLimiter when Redis is available.

      - id: analytics-service
        uri: lb://analytics-service
        predicates:
          - Path=/api/v1/analytics/**
        filters:
          - RewritePath=/api/v1/analytics(?<segment>/?.*), /api/v1${segment}
          # Rate limiting placeholder: enable RequestRateLimiter when Redis is available.

      - id: media-service
        uri: lb://media-service
        predicates:
          - Path=/api/media/**, /api/v1/media/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  health:
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: "1. Auth Service"
        url: /auth-service/v3/api-docs
      - name: "2. User Service"
        url: /user-service/v3/api-docs
      - name: "3. Profile Service"
        url: /profile-service/v3/api-docs
      - name: "4. Product Service"
        url: /product-service/v3/api-docs
      - name: "5. Fashion Discovery Service"
        url: /fashion-discovery-service/v3/api-docs
      - name: "6. Search Service"
        url: /search-service/v3/api-docs
      - name: "7. Recommendation Service"
        url: /recommendation-service/v3/api-docs
      - name: "8. Outfit Detection Service"
        url: /outfit-detection-service/v3/api-docs
      - name: "9. Image Processing Service"
        url: /image-processing-service/v3/api-docs
      - name: "10. Visual Search Service"
        url: /visual-search-service/v3/api-docs
      - name: "11. AI Stylist Service"
        url: /ai-stylist-service/v3/api-docs
      - name: "12. Moodboard Service"
        url: /moodboard-service/v3/api-docs
      - name: "13. Shopping Service"
        url: /shopping-service/v3/api-docs
      - name: "14. Order Service"
        url: /order-service/v3/api-docs
      - name: "15. Payment Service"
        url: /payment-service/v3/api-docs
      - name: "16. Inventory Service"
        url: /inventory-service/v3/api-docs
      - name: "17. Brand Integration Service"
        url: /brand-integration-service/v3/api-docs
      - name: "18. Notification Service"
        url: /notification-service/v3/api-docs
      - name: "19. Analytics Service"
        url: /analytics-service/v3/api-docs
      - name: "20. Media Service"
        url: /media-service/v3/api-docs

gateway:
  cors:
    allowed-origins: "*"

logging:
  config: classpath:logback-spring.xml

---
spring:
  config:
    activate:
      on-profile: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
management:
  tracing:
    enabled: false

